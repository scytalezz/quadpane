name: Release portable build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Windows filesystem tests
        run: npm test
      - name: Build portable executable
        run: npm run build:portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create checksums
        run: |
          Get-ChildItem -LiteralPath dist-portable -Filter '*.exe' | ForEach-Object {
            $artifactHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$artifactHash  $($_.Name)"
          } | Set-Content -LiteralPath dist-portable/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $executables = (Get-ChildItem -LiteralPath dist-portable -Filter '*.exe').FullName
          gh release create $env:GITHUB_REF_NAME @($executables) dist-portable/SHA256SUMS.txt --title "Quadpane $env:GITHUB_REF_NAME" --generate-notes
